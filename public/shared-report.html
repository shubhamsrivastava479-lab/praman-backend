<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case Report — Praman</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#eef1f4;margin:0;color:#1a1a1a;}
  .toolbar{position:sticky;top:0;background:#10151f;padding:10px 20px;text-align:right;}
  .toolbar button{padding:8px 16px;border:none;border-radius:6px;background:#3a4356;color:#fff;font-weight:600;cursor:pointer;font-size:13px;}
  .sheet{max-width:800px;margin:20px auto;background:#fff;padding:36px 40px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  h1{font-family:Georgia,serif;font-size:22px;margin:0 0 4px;}
  .meta{font-size:11px;color:#777;margin-bottom:20px;}
  table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:12px;}
  th{background:#1a2f4b;color:#fff;padding:6px 8px;text-align:left;font-size:11px;}
  td{border:1px solid #e2e5e9;padding:6px 8px;font-size:11.5px;}
  .section-h{font-family:Georgia,serif;font-size:15px;margin:22px 0 8px;}
  .report-html h2{font-size:15px;margin-top:16px;}
  .report-html p{font-size:12.5px;line-height:1.6;}
  .empty{color:#999;font-size:12px;}
  .furl{font-size:10px;color:#888;word-break:break-all;}
  .hint{font-size:11.5px;color:#666;margin:0 0 8px;}
  table.doc{margin-bottom:12px;page-break-inside:auto;}
  table.doc th{font-size:12px;} table.doc th .sub{font-weight:400;opacity:.85;}
  table.doc td.k{width:28%;background:#f4f6f8;font-weight:700;font-size:11px;color:#444;}
  td.pre{white-space:pre-wrap;}
  tr{page-break-inside:avoid;}
  a{color:#1f5fa8;}
  @media print { .toolbar{display:none;} body{background:#fff;} .sheet{box-shadow:none;} }
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button></div>
<div class="sheet" id="sheet">
  <div class="empty">Loading report…</div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');

async function load(){
  const sheet = document.getElementById('sheet');
  if(!token){ sheet.innerHTML = '<div class="empty">No report link token provided.</div>'; return; }
  const res = await fetch('/api/public/case/' + token);
  const c = await res.json();
  if(c.error){ sheet.innerHTML = '<div class="empty">' + c.error + '</div>'; return; }
  if(c.hasAiReport){ location.replace('/ai-report.html?token=' + encodeURIComponent(token)); return; }

  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const abs = p => p ? location.origin + p : '';
  const openLink = (p, label) => p ? `<a href="${esc(abs(p))}" target="_blank" rel="noopener"><b>${esc(label)}</b></a><div class="furl">${esc(abs(p))}</div>` : '—';
  const docs = c.documents || [], recs = c.recordings || [];
  const docBlocks = docs.map((x, i) => `
    <table class="doc">
      <tr><th colspan="2">D${i + 1}. ${esc(x.title)} <span class="sub">— ${esc(x.kind)} · ${esc(x.source)}${x.from ? ' · from ' + esc(x.from) : ''} · ${new Date(x.at).toLocaleString('en-IN')} · ID ${esc(x.id)}</span></th></tr>
      <tr><td class="k">File</td><td>${x.hasFile ? openLink(x.link, x.kind === 'Video' ? '▶ Watch video' : x.kind === 'Voice note' ? '▶ Play voice note' : 'Open file') : '—'}</td></tr>
      ${x.caption && x.caption !== x.title ? `<tr><td class="k">Customer's message</td><td>${esc(x.caption)}</td></tr>` : ''}
      ${x.keyDetails ? `<tr><td class="k">Key details</td><td class="pre">${esc(x.keyDetails)}</td></tr>` : ''}
      ${x.text ? `<tr><td class="k">Text in the file${x.language ? ' (' + esc(x.language) + ')' : ''}</td><td class="pre">${esc(x.text)}</td></tr>` : ''}
      ${x.english ? `<tr><td class="k">English translation</td><td class="pre">${esc(x.english)}</td></tr>` : ''}
      ${x.observations ? `<tr><td class="k">AI observations</td><td>${esc(x.observations)}</td></tr>` : ''}
      ${x.maskedAadhaar ? `<tr><td class="k">Privacy</td><td>First 8 digits of the Aadhaar number blacked out before storing.</td></tr>` : ''}
      ${x.note ? `<tr><td class="k">Note</td><td>${esc(x.note)}</td></tr>` : ''}
    </table>`).join('') || '<p class="empty">No documents or media on file.</p>';
const chatTable = rows => rows.length ? rows.map(x => `<tr><td>${esc(x.searchTerm || '—')}</td><td>${esc(x.chat || '—')}${x.sender && x.sender !== x.chat ? '<br><span style="color:#777;">by ' + esc(x.sender) + '</span>' : ''}</td><td>${esc(x.date || '—')}${x.time ? '<br>' + esc(x.time) : ''}</td><td>${x.noResults ? '<i style="color:#999;">No results for this search</i>' : esc(x.text)}${x.english ? '<br><span style="color:#777;">English: ' + esc(x.english) + '</span>' : ''}</td><td>${x.link ? `<a href="${esc(abs(x.link))}" target="_blank" rel="noopener">${esc(x.screenshot || 'Open')}</a>` : esc(x.screenshot)}</td></tr>`).join('') : '<tr><td colspan="5" style="color:#999;">No WhatsApp search screenshots received.</td></tr>';
  const recordingRows = recs.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.kind)}${r.notes ? '<br><span style="color:#777;">' + esc(r.notes) + '</span>' : ''}</td><td>${new Date(r.at).toLocaleString('en-IN')}</td><td>${openLink(r.link, '▶ Play recording')}</td></tr>`).join('')
    || '<tr><td colspan="4" class="empty">No call recordings on file.</td></tr>';

  sheet.innerHTML = `
    <h1>Case Report — ${esc(c.claimNo)}</h1>${c.caseRef ? `<div class="meta">Case no. ${esc(c.caseRef)}</div>` : ''}
    <div class="meta">${c.caseType === 'policy_verification' ? 'Policy Issuance Verification' : 'Claim Investigation'} · Generated ${new Date().toLocaleString()}</div>

    <table>
      <tr><th colspan="2">Case Details</th></tr>
      <tr><td><b>Insured Name</b></td><td>${esc(c.insuredName || '—')}</td></tr>
      ${c.lastKnownLocation ? `<tr><td><b>Verification Location</b></td><td>${c.lastKnownLocation.latitude.toFixed(5)}, ${c.lastKnownLocation.longitude.toFixed(5)} — ${new Date(c.lastKnownLocation.capturedAt).toLocaleString()} (<a href="https://maps.google.com/?q=${c.lastKnownLocation.latitude},${c.lastKnownLocation.longitude}" target="_blank">map</a>)</td></tr>` : ''}
      <tr><td><b>Policy No.</b></td><td>${esc(c.policyNo || '—')}</td></tr>
      <tr><td><b>Vehicle No.</b></td><td>${esc(c.vehicleNo || '—')}</td></tr>
      <tr><td><b>District</b></td><td>${esc(c.district || '—')}</td></tr>
      <tr><td><b>Status</b></td><td>${c.status}</td></tr>
    </table>

    <div class="section-h">Call Recordings</div>
    <table><tr><th>#</th><th>Call</th><th>Saved on</th><th>Recording</th></tr>${recordingRows}</table>

    <div class="section-h">Documents &amp; Media Received (${docs.length})</div>
    <p class="hint">Text below was read by AI from each file. Click a link to open the original — links stay active as long as this report link is active.</p>
    ${docBlocks}

    ${(c.chats || []).length ? `<div class="section-h">WhatsApp History Check</div><p class="hint">The customer searched their own WhatsApp (e.g. accident, theft, police) and sent screenshots of the results. Messages below were read by AI; open the screenshot to see the original.</p><table><tr><th>Search</th><th>Chat / contact</th><th>Date &amp; time</th><th>Message</th><th>Screenshot</th></tr>${chatTable(c.chats)}</table>` : ''}

    ${c.report ? `<div class="section-h">Investigation Report</div><div class="report-html">${c.report.html}</div>` : ''}
  `;
}
load();
</script>
</body>
</html>
