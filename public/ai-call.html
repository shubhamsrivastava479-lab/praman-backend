<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Praman Verification Call</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#04345a">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#22307A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22307A; --ink-2:#3A4A9E; --paper:#FFFFFF; --mist:#EEF1F8; --line:#D9DEEC;
    --text:#1A1F36; --muted:#5B6280; --turmeric:#E09A12; --leaf:#18865A; --alert:#B4372B;
    --sheet:#FFFFFF; --cam:#05070F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--mist);color:var(--text);font-family:'Mukta',system-ui,sans-serif;font-size:17px;line-height:1.5;}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--turmeric);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }

  /* ---------- start screen ---------- */
  #start{max-width:520px;margin:0 auto;padding:20px 16px 120px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .seal{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;}
  .brand b{font-size:21px;color:var(--ink);display:block;line-height:1.1;}
  .brand small{color:var(--muted);font-size:14px;}
  .ai-note{background:var(--ink);color:#fff;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;}
  .ai-note svg{flex:none;margin-top:3px;}
  .ai-note h1{font-size:20px;margin:0 0 2px;line-height:1.3;font-weight:700;}
  .ai-note p{margin:0;font-size:15px;opacity:.88;}
  h2{font-size:17px;margin:26px 0 10px;color:var(--ink);font-weight:700;}
  .langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .lang{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 4px;font-size:16px;font-weight:600;color:var(--text);cursor:pointer;min-height:52px;}
  .lang[aria-pressed="true"]{border-color:var(--ink);background:#E6E9F7;color:var(--ink);}
  ol.steps{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:16px;border:1px solid var(--line);}
  ol.steps li{display:flex;gap:14px;padding:12px 16px;border-top:1px solid var(--mist);align-items:flex-start;}
  ol.steps li:first-child{border-top:none;}
  ol.steps .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--mist);color:var(--ink);font-weight:700;display:grid;place-items:center;font-size:15px;margin-top:1px;}
  ol.steps b{display:block;font-size:16px;line-height:1.35;}
  ol.steps span{color:var(--muted);font-size:14.5px;}
  .ready{display:flex;flex-wrap:wrap;gap:8px;}
  .ready span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;}
  .consent{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:22px;font-size:15px;cursor:pointer;}
  .consent input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--ink);}
  .cta-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--mist) 70%,transparent);}
  .cta-bar .in{max-width:520px;margin:0 auto;}
  .btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:18px;font-weight:700;cursor:pointer;min-height:56px;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.primary:disabled{background:#A9AFC8;}
  .btn.wa{background:#1F9D57;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;}
  .btn.plain{background:transparent;color:var(--muted);font-size:15px;font-weight:500;min-height:44px;padding:8px;}
  .err{color:var(--alert);font-size:15px;min-height:20px;margin:6px 0 0;}
  .hint{color:var(--muted);font-size:14.5px;}

  /* ---------- call screen ---------- */
  #call{display:none;position:fixed;inset:0;background:var(--cam);color:#fff;}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  .top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 24px;background:linear-gradient(to bottom,rgba(5,7,15,.75),transparent);z-index:3;}
  .toprow{display:flex;justify-content:space-between;align-items:center;font-size:14px;}
  .pill{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:999px;padding:4px 12px;display:inline-flex;gap:7px;align-items:center;}
  .pill i{width:9px;height:9px;border-radius:50%;background:#FF4D4D;animation:blink 1.4s infinite;}
  @keyframes blink{50%{opacity:.25}}
  .phases{display:flex;gap:4px;margin-top:10px;}
  .phases div{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.22);transition:background .3s;}
  .phases div.done{background:#fff;} .phases div.now{background:var(--turmeric);}
  .phase-name{font-size:15px;margin-top:6px;font-weight:600;}

  /* guides: the one bold element */
  .guide{position:absolute;top:150px;left:0;right:0;bottom:var(--sheetH,40vh);display:none;align-items:center;justify-content:center;pointer-events:none;z-index:2;}
  .guide.show{display:flex;}
  .oval{height:90%;max-height:480px;aspect-ratio:3/4;border-radius:50%;border:4px dashed rgba(255,255,255,.9);box-shadow:0 0 0 200vmax rgba(5,7,15,.45);}
  .guide.blinking .oval{border-color:var(--turmeric);border-style:solid;}
  .figure{height:94%;max-height:560px;opacity:.9;}
  .countdown{position:absolute;top:150px;left:0;right:0;bottom:var(--sheetH,40vh);display:none;align-items:center;justify-content:center;z-index:4;pointer-events:none;}
  .countdown.show{display:flex;}
  .ring{position:relative;width:132px;height:132px;}
  .ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.6);}
  .countdown.corner{align-items:flex-start;justify-content:flex-start;padding:0 14px;}
  .countdown.corner .ring{width:92px;height:92px;} .countdown.corner .ring b{font-size:44px;}
  #call.body #cam{height:calc(100% - var(--sheetH,40vh));}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .35s;}
  .flash.on{opacity:.85;transition:none;}

  /* photo steps: small sheet, big camera area, big face oval */
  #call.shoot .guide, #call.shoot .countdown{top:calc(104px + env(safe-area-inset-top));}
  #call.shoot .sheet{max-height:24vh;}
  #call.shoot .caption{font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0 0;}
  #call.shoot #actions, #call.shoot #typeBtn, #call.shoot .heard{display:none !important;}
  #call.shoot .avatar{transform:scale(.68);transform-origin:top right;}
  /* AI assistant tile: shows the call is connected; mouth moves with the voice */
  .avatar{position:absolute;right:12px;top:calc(96px + env(safe-area-inset-top));z-index:3;width:110px;text-align:center;}
  .av-face{position:relative;width:110px;height:110px;border-radius:24px;overflow:hidden;border:2px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(0,0,0,.45);transition:box-shadow .1s;}
  .av-face svg{display:block;width:100%;height:100%;}
  .av-eyes{transform-origin:60px 62px;animation:avblink 4.2s infinite;}
  @keyframes avblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .av-mouth{transform-origin:60px 79px;transform:scaleY(calc(.08 + var(--m,0) * .95));}
  .av-smile{opacity:calc(1 - var(--m,0) * 3);}
  .avatar.tts .av-mouth{animation:avtalk .32s infinite alternate ease-in-out;} .avatar.tts .av-smile{opacity:0;}
  @keyframes avtalk{from{transform:scaleY(.15)}to{transform:scaleY(.85)}}
  .av-ai .av-face{box-shadow:0 0 0 calc(3px + var(--m,0) * 10px) rgba(224,154,18,.6),0 6px 20px rgba(0,0,0,.45);}
  .av-listen .av-face{box-shadow:0 0 0 calc(3px + var(--lvl,0) * 12px) rgba(24,190,110,.65),0 6px 20px rgba(0,0,0,.45);}
  .av-dots{position:absolute;left:0;right:0;bottom:6px;display:none;justify-content:center;gap:4px;}
  .av-think .av-dots{display:flex;}
  .av-dots i{width:7px;height:7px;border-radius:50%;background:#fff;animation:dots 1.2s infinite;} .av-dots i:nth-child(2){animation-delay:.2s} .av-dots i:nth-child(3){animation-delay:.4s}
  .av-name{margin-top:5px;font-size:11.5px;font-weight:600;line-height:1.25;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8);}
  .av-name i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#31D07F;margin-right:3px;vertical-align:1px;}
  .toast{position:absolute;left:14px;right:136px;top:calc(98px + env(safe-area-inset-top));z-index:7;background:rgba(24,134,90,.95);color:#fff;border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600;opacity:0;transform:translateY(-6px);transition:all .3s;pointer-events:none;}
  .toast.show{opacity:1;transform:none;}
  .typebox{display:none;gap:8px;margin-top:8px;} .typebox.show{display:flex;}
  .typebox input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;}
  .typebox .btn{width:auto;min-height:48px;padding:10px 18px;font-size:16px;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);color:var(--text);border-radius:22px 22px 0 0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));max-height:62vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.35);}
  .who{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted);font-weight:600;}
  .orb{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--mist);}
  .orb .bars{display:flex;gap:3px;align-items:center;height:16px;}
  .orb .bars span{width:3px;height:6px;border-radius:2px;background:var(--muted);}
  .st-ai .orb{background:#FBEFD6;} .st-ai .orb .bars span{background:var(--turmeric);animation:wave .9s infinite ease-in-out;}
  .st-ai .orb .bars span:nth-child(2){animation-delay:.15s} .st-ai .orb .bars span:nth-child(3){animation-delay:.3s}
  @keyframes wave{50%{height:16px}}
  .st-listen .orb{background:#DDF1E7;box-shadow:0 0 0 calc(var(--lvl,0) * 14px) rgba(24,134,90,.25);transition:box-shadow .08s;}
  .st-listen .orb .bars span{background:var(--leaf);}
  .st-think .orb .bars span{background:var(--ink-2);animation:dots 1.2s infinite;}
  .st-think .orb .bars span:nth-child(2){animation-delay:.2s} .st-think .orb .bars span:nth-child(3){animation-delay:.4s}
  @keyframes dots{50%{opacity:.2}}
  .st-wait .orb{background:#FBEFD6;} .st-wait .orb .bars span{background:var(--turmeric);}
  .caption{font-size:21px;line-height:1.45;font-weight:500;margin:10px 0 4px;color:var(--text);}
  .heard{font-size:14.5px;color:var(--muted);min-height:0;}
  .heard:empty{display:none;}
  .actions{display:flex;gap:8px;margin-top:12px;}
  .actions .btn{font-size:16px;min-height:50px;padding:10px;}
  .btn.done{background:var(--leaf);color:#fff;}
  .btn.ghost{background:var(--mist);color:var(--ink);}
  .docs{display:none;margin-top:12px;}
  .docs.show{display:block;}
  .docrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--mist);font-size:16px;}
  .tag{font-size:14px;font-weight:600;border-radius:999px;padding:2px 12px;}
  .tag.wait{background:#FBEFD6;color:#8A5A00;} .tag.ok{background:#DDF1E7;color:var(--leaf);}
  .human{display:block;margin:10px auto 0;}
  .human.pulse{background:#fff3cd;color:#5c4400;border-radius:12px;animation:hpulse 1.4s infinite;}
  @keyframes hpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,193,7,.7)}50%{box-shadow:0 0 0 10px rgba(255,193,7,0)}}
  body.big .caption{font-size:23px !important;line-height:1.4 !important;}
  body.big .btn{font-size:19px;min-height:56px;}
  body.big #heard,body.big .heard{font-size:18px;}
  .prefs{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px;font-size:15px;}
  .prefs label{display:flex;gap:9px;align-items:center;min-height:30px;}
  .pausebtn{border:0;cursor:pointer;color:#fff;font:inherit;}
  #pauseOv{position:fixed;inset:0;background:rgba(10,14,28,.88);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:24px;}
  #pauseOv.show{display:flex;}
  #testDlg{border:0;border-radius:16px;padding:18px;max-width:440px;width:92vw;}
  #testDlg video{width:100%;border-radius:12px;background:#000;transform:scaleX(-1);}
  .lvlbar{height:10px;background:#e3e6ef;border-radius:6px;overflow:hidden;margin:10px 0;}
  .lvlbar i{display:block;height:100%;width:0;background:#3A4AA6;transition:width .08s;}
  .kw{margin-top:10px;font-size:15px;color:var(--muted);}
  .kw b{display:inline-block;background:var(--mist);color:var(--ink);border-radius:999px;padding:2px 12px;margin:4px 4px 0 0;font-size:16px;}
  .netbar{display:none;background:var(--alert);color:#fff;font-size:14px;text-align:center;padding:6px;border-radius:10px;margin-top:10px;}
  .netbar.show{display:block;}

  /* ---------- end screen ---------- */
  #end{display:none;max-width:520px;margin:0 auto;padding:60px 20px;text-align:center;}
  #end .big{width:84px;height:84px;border-radius:50%;background:#DDF1E7;display:grid;place-items:center;margin:0 auto 18px;}
  #end h1{font-size:26px;color:var(--ink);margin:0 0 8px;}
  #end p{color:var(--muted);font-size:17px;}

  dialog{border:none;border-radius:18px;padding:22px;max-width:360px;width:calc(100% - 32px);}
  dialog::backdrop{background:rgba(5,7,15,.6);}
  dialog h3{margin:0 0 6px;font-size:19px;color:var(--ink);}
  dialog p{margin:0 0 16px;color:var(--muted);font-size:15.5px;}
  dialog .row{display:flex;gap:8px;}
</style>
<script src="/open-in-browser.js"></script>
</head>
<body>

<!-- ================= START ================= -->
<main id="start">
  <div class="brand">
    <img src="/logo-mark.png" alt="Praman" style="height:40px;width:auto;flex:none;">
    <div><b>Praman</b><small id="firmLine"></small></div>
  </div>

  <section class="ai-note" aria-live="polite">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V4"/><circle cx="12" cy="3" r="1"/><circle cx="9" cy="13" r="1.2" fill="#fff"/><circle cx="15" cy="13" r="1.2" fill="#fff"/><path d="M2 12v3M22 12v3"/></svg>
    <div>
      <h1 data-t="aiTitle"></h1>
      <p id="intro"></p>
    </div>
  </section>

  <h2 data-t="chooseLang"></h2>
  <div class="langs" id="langs" role="group"></div>

  <h2 data-t="whatHappens"></h2>
  <ol class="steps" id="steps"></ol>

  <h2 data-t="keepReady"></h2>
  <div class="ready" id="ready"></div>

  <h2 data-t="prefTitle"></h2>
  <div class="prefs">
    <label><input type="checkbox" id="pfSlow"><span data-t="prefSlow"></span></label>
    <label><input type="checkbox" id="pfBig"><span data-t="prefBig"></span></label>
    <label><input type="checkbox" id="pfType"><span data-t="prefType"></span></label>
  </div>
  <button type="button" class="btn ghost" id="testBtn" data-t="testBtn" style="margin-bottom:14px;"></button>

  <label class="consent">
    <input type="checkbox" id="consent">
    <span data-t="consent"></span>
  </label>
  <p style="text-align:center;margin:8px 0;"><a id="privLink" href="/privacy.html" target="_blank" rel="noopener" style="color:#1f2a6b;font-size:14px;" data-t="privacy"></a></p>
  <div data-browser-help></div>
  <p class="err" id="startErr"></p>

  <div class="cta-bar"><div class="in">
    <button class="btn primary" id="startBtn" disabled data-t="startBtn"></button>
  </div></div>
</main>

<!-- ================= CALL ================= -->
<div id="call">
  <video id="cam" autoplay playsinline muted></video>

  <div class="top">
    <div class="toprow">
      <span class="pill"><i></i><span data-t="rec"></span> <span id="timer">0:00</span></span>
      <span class="pill" data-t="aiBadge"></span>
      <button type="button" class="pill pausebtn" id="pauseBtn" data-t="pause"></button>
    </div>
    <div class="phases" id="phases"></div>
    <div class="phase-name" id="phaseName"></div>
  </div>

  <div class="avatar av-wait" id="avatar" aria-hidden="true">
    <div class="av-face">
      <svg viewBox="0 0 120 120">
        <defs><linearGradient id="avbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4AA6"/><stop offset="1" stop-color="#1A2463"/></linearGradient></defs>
        <rect width="120" height="120" fill="url(#avbg)"/>
        <path d="M22 120c4-22 20-32 38-32s34 10 38 32z" fill="#E09A12"/>
        <path d="M48 92l12 12 12-12" fill="#F7E3B8"/>
        <rect x="53" y="80" width="14" height="14" rx="5" fill="#E7B48C"/>
        <path d="M27 58c0-24 15-38 33-38s33 14 33 38c0 6-1 10-3 14-2-14-8-24-12-28-6 6-22 10-36 10-3 6-5 12-6 18-6-2-9-8-9-14z" fill="#2A1F2D"/>
        <ellipse cx="60" cy="62" rx="26" ry="29" fill="#F0C8A4"/>
        <path d="M34 54c4-14 14-20 26-20s22 6 26 20c-8-6-17-9-26-9s-18 3-26 9z" fill="#2A1F2D"/>
        <path d="M45 54q5-3 10 0M65 54q5-3 10 0" stroke="#3B2A2A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <g class="av-eyes"><ellipse cx="50" cy="62" rx="3.4" ry="4.2" fill="#2B2236"/><ellipse cx="70" cy="62" rx="3.4" ry="4.2" fill="#2B2236"/></g>
        <circle cx="44" cy="72" r="4" fill="#F2A9A0" opacity=".45"/><circle cx="76" cy="72" r="4" fill="#F2A9A0" opacity=".45"/>
        <g class="av-mouth"><ellipse cx="60" cy="79" rx="7" ry="5" fill="#7A2E3A"/></g>
        <path class="av-smile" d="M53 78q7 6 14 0" stroke="#7A2E3A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M29 62c0-20 14-34 31-34s31 14 31 34" stroke="#E9ECF8" stroke-width="4" fill="none" stroke-linecap="round"/>
        <rect x="24" y="56" width="9" height="15" rx="4" fill="#E9ECF8"/><rect x="87" y="56" width="9" height="15" rx="4" fill="#E9ECF8"/>
        <path d="M30 70q4 14 18 12" stroke="#E9ECF8" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="49" cy="82" r="2.6" fill="#E9ECF8"/>
      </svg>
      <span class="av-dots"><i></i><i></i><i></i></span>
    </div>
    <div class="av-name"><i></i><span data-t="aiName"></span> · <span data-t="live"></span></div>
  </div>
  <div class="toast" id="toast"></div>

  <div class="guide" id="gFace"><div class="oval"></div></div>
  <div class="guide" id="gStand">
    <svg class="figure" viewBox="0 0 100 200" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6" aria-hidden="true">
      <circle cx="50" cy="20" r="12"/><path d="M50 34v74M50 46l-20 50M50 46l20 50M50 108l-13 82M50 108l13 82"/>
      <path d="M20 194h60" stroke-dasharray="0" stroke="var(--turmeric)"/>
    </svg>
  </div>
  <div class="guide" id="gSit">
    <svg class="figure" viewBox="0 0 100 200" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6" aria-hidden="true">
      <circle cx="42" cy="44" r="12"/><path d="M42 58v62M42 70l22 38M42 120h36M78 120v66"/>
      <path d="M30 128h58M34 128v60M84 128v60" stroke="var(--turmeric)" stroke-dasharray="0"/>
    </svg>
  </div>

  <div class="countdown" id="countdown">
    <div class="ring">

(async function load(){
  if (!token) { introKey = 'badLink'; paintText(); return; }

    const r = await fetch(API + '/info'); const d = await r.json();

    info = d; introKey = d.status === 'handoff' ? 'endHuman' : d.status === 'completed' ? 'already' : 'case'; paintText();

    $('startBtn').disabled = !$('consent').checked;
    if (d.businessNumber) $('waLink').href = 'https://wa.me/' + d.businessNumber; else { $('waLink').removeAttribute('href'); $('waLink').style.display = 'none'; }

})();

// ---------- network ----------
async function post(path, body, isForm){
  let lastErr;
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch(API + path, isForm ? { method: 'POST', headers: { 'X-Call-Client': clientId }, body } : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Call-Client': clientId }, body: JSON.stringify(body || {}) });
      const d = await r.json().catch(() => ({}));
      if (r.status === 429) { await sleep(4000); continue; }
      if (r.status === 409) { $('netbar').classList.remove('show'); return { inactive: true, replaced: !!d.replaced }; }
      if (!r.ok) throw new Error(d.error || 'Server error');
      $('netbar').classList.remove('show');
      return d;
    } catch (e) { lastErr = e; $('netbar').classList.add('show'); await sleep(2500); }
  }
  throw lastErr;
}

function setStatus(kind, key){
  $('who').className = 'who st-' + kind;
  $('avatar').className = 'avatar av-' + kind;
  $('typeBtn').style.display = kind === 'listen' ? 'block' : 'none';
  if (kind !== 'listen') $('typeBox').classList.remove('show'); else if (prefs.type) $('typeBox').classList.add('show');
  $('statusText').textContent = tr(key);
  $('doneBtn').style.display = kind === 'listen' ? 'block' : 'none';
  $('repeatBtn').disabled = kind !== 'listen' && kind !== 'wait';
}

// ---------- location: kept fresh during the call, sent with every photo ----------
function startGeo(){
  if (!navigator.geolocation) return;
  try {
    geoWatch = navigator.geolocation.watchPosition(
      p => { lastLoc = { latitude: p.coords.latitude, longitude: p.coords.longitude, accuracy: p.coords.accuracy }; },
      () => {}, { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
  } catch {}
}
function addLoc(fd){ if (lastLoc) { fd.append('lat', lastLoc.latitude); fd.append('lng', lastLoc.longitude); fd.append('acc', lastLoc.accuracy || ''); } }


// ---------- comfort options, pause, camera/mic practice ----------

// ---------- start ----------
async function startCall(){
  $('startErr').textContent = '';
  $('startBtn').disabled = true;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    $('cam').srcObject = camStream;
  } catch (e) { $('startErr').textContent = tr('camErr'); $('startBtn').disabled = false; try { PramanBrowserHelp.show(document.querySelector('[data-browser-help]'), 'blocked'); } catch {} return; }

  let loc = null;
  try {
    loc = await new Promise(res => navigator.geolocation
      ? navigator.geolocation.getCurrentPosition(p => res({ latitude: p.coords.latitude, longitude: p.coords.longitude, accuracy: p.coords.accuracy }), () => res(null), { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 })
      : res(null));
  } catch { loc = null; }
  lastLoc = loc; startGeo();
  const deviceInfo = { platform: navigator.userAgentData?.platform || navigator.platform, screen: screen.width + 'x' + screen.height, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone };

  let first;
  const attempt = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  try { first = await post('/start', { language, consent: true, location: loc, deviceInfo, attempt }); }
  catch (e) { $('startErr').textContent = tr('startErr'); $('startBtn').disabled = false; return; }
  if (first.done) { showEnd(first.message); return; }
  if (first.inactive) { showEnd(tr('replaced')); return; }

  micSrc = ctx.createMediaStreamSource(camStream);
  recDest = ctx.createMediaStreamDestination();
  micSrc.connect(recDest);
  startRecorder();
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}

  $('start').style.display = 'none';
  $('call').style.display = 'block';
  started = true; t0 = Date.now();
  setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 1000);
  run(first.turn);
}

function startRecorder(){
  try {
    const stream = new MediaStream([...camStream.getVideoTracks(), ...recDest.stream.getAudioTracks()]);
    const types = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
    const mimeType = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    recorder = new MediaRecorder(stream, mimeType ? { mimeType, videoBitsPerSecond: 600000, audioBitsPerSecond: 48000 } : undefined);
    recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.start(5000);
  } catch (e) { recorder = null; }
}

// ---------- main loop ----------
async function run(turn){
  toast(tr('connectedToast'));
  let replay = true;
  while (turn && !finished && !handedOff) {
    showTurn(turn);
    if (replay) await play(turn);
    replay = true;
    if (handedOff) return;
    if (turn.done) { await finish(); return; }
    await gate();
    let next;
    try { next = await act(turn); }
    catch (e) {
      // Network trouble: ask for the answer again without repeating the question.
      $('heard').textContent = tr('sayAgain');
      await sleep(1200); replay = false; continue;
    }
    if (next && next.inactive) { if (next.replaced) { stopAll(); showEnd(tr('replaced')); } return; }
    turn = next;
  }
}
function toast(text){ const t = $('toast'); t.textContent = text; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500); }
function stopAll(){ finished = true; try { recorder && recorder.state !== 'inactive' && recorder.stop(); } catch {} try { camStream.getTracks().forEach(t => t.stop()); } catch {} }

function showTurn(t){
  lastText = t.displayText || t.say;
  if (t.typeHint) openTypeNext = true;
  $('cap').textContent = lastText;
  $('docs').classList.toggle('show', t.expect === 'docs');
  $('call').classList.toggle('shoot', t.expect === 'photo' || t.expect === 'burst');
  showGuide(t.expect === 'photo' || t.expect === 'burst' ? t.shot : null);
  const ph = t.phase || 'details';
  const order = [...$('phases').children].map(d => d.dataset.p);
  const idx = order.indexOf(ph);
  [...$('phases').children].forEach((d, i) => d.className = ph === 'done' || i < idx ? 'done' : i === idx ? 'now' : '');
  $('phaseName').textContent = tr('p_' + ph) + (ph !== 'done' && idx >= 0 ? ' · ' + tr('stepOf')(idx + 1, order.length) : '');
  $('humanBtn').classList.toggle('pulse', !!t.offerHuman);
  if (t.offerHuman) openTypeNext = true;
}

function showGuide(shot){
  ['gFace','gStand','gSit'].forEach(id => $(id).classList.remove('show','blinking'));
  if (shot === 'face' || shot === 'blink') $('gFace').classList.add('show');
  if (shot === 'stand') $('gStand').classList.add('show');
  if (shot === 'sit') $('gSit').classList.add('show');
  const body = shot === 'stand' || shot === 'sit';
  $('cam').style.objectFit = body ? 'contain' : 'cover';
  $('call').classList.toggle('body', body);
  $('countdown').classList.toggle('corner', body);
}

async function play(t){
  setStatus('ai', 's_ai');
  lastAudio = t.audio || null;
  await playAudio(t.audio, t.displayText || t.say);
}
async function playAudio(b64, text){
  if (b64) {
    try {
      const buf = await ctx.decodeAudioData(b64ToBuf(b64));
      await new Promise(resolve => {
        const src = ctx.createBufferSource(); src.buffer = buf; if (prefs.slow) src.playbackRate.value = 0.85;
        src.connect(ctx.destination); src.connect(recDest);
        const an = ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
        const data = new Float32Array(an.fftSize); let live = true;
        // microphone level while the AI speaks (for barge-in)
        let mic = null, micData = null, loudSince = 0;
        if (BARGE_IN && micSrc && !allowBarge.off) { try { mic = ctx.createAnalyser(); mic.fftSize = 1024; micSrc.connect(mic); micData = new Float32Array(mic.fftSize); } catch { mic = null; } }
        const began = Date.now();
        const tick = () => {
          if (!live) return;
          an.getFloatTimeDomainData(data);
          let s = 0; for (let i = 0; i < data.length; i++) s += data[i] * data[i];
          $('avatar').style.setProperty('--m', Math.min(1, Math.sqrt(s / data.length) * 7).toFixed(2));
          if (mic && Date.now() - began > 1500) {
            mic.getFloatTimeDomainData(micData);
            let m = 0; for (let i = 0; i < micData.length; i++) m += micData[i] * micData[i];
            const lvl = Math.sqrt(m / micData.length);
            if (lvl > 0.12) { if (!loudSince) loudSince = Date.now(); else if (Date.now() - loudSince > 450) { bargedIn = true; try { src.stop(); } catch {} } }
            else loudSince = 0;
          }
          requestAnimationFrame(tick);
        };
        tick();
        src.onended = () => { live = false; try { mic && micSrc.disconnect(mic); } catch {} $('avatar').style.setProperty('--m', 0); resolve(); };
        src.start();
      });
      return;
    } catch (e) { /* fall back to the phone's own voice */ }
  }
  await new Promise(resolve => {
    try {
      const u = new SpeechSynthesisUtterance(text); if (prefs.slow) u.rate = 0.85;
      u.lang = LANG_CODES[language] || 'en-IN';
      $('avatar').classList.add('tts');
      const doneT = () => { $('avatar').classList.remove('tts'); resolve(); };
      u.onend = doneT; u.onerror = doneT;
      speechSynthesis.speak(u); setTimeout(doneT, 25000);
    } catch { setTimeout(resolve, 2500); }
  });
}
function b64ToBuf(b64){ const bin = atob(b64); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a.buffer; }

async function act(t){
  if (t.expect === 'voice') return doVoice(t);
  if (t.expect === 'photo') return doPhoto(t);
  if (t.expect === 'burst') return doBlink(t);
  if (t.expect === 'docs') return doDocs(t);

}

// ---------- voice (stops by itself when you go quiet, or tap "I have finished") ----------
function listen(){
  return new Promise(resolve => {
    setStatus('listen', 's_listen');
    let chunks = []; let speech = false, lastVoice = 0, noise = 0, cal = 0, done = false, firstIdx = -1, lastIdx = -1, firstVoiceAt = 0;
    let start = Date.now();
    if (openTypeNext) { openTypeNext = false; setTimeout(openType, 50); }
    proc = ctx.createScriptProcessor(4096, 1, 1);
    const mute = ctx.createGain(); mute.gain.value = 0;
    micSrc.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    const stop = (mode, text) => {
      if (mode === 'cancel') { chunks = []; speech = false; start = Date.now() + 60000; return; } // paused while replaying
      if (done) return; done = true; endListen = null;
      proc.onaudioprocess = null; try { micSrc.disconnect(proc); proc.disconnect(); mute.disconnect(); } catch {}
      $('who').style.removeProperty('--lvl'); $('avatar').style.removeProperty('--lvl');
      if (mode === 'typed') { resolve({ text, silent: false }); return; }
      const silent = mode === 'silent' || (mode === 'done' && !speech && chunks.length < 4);
      // send only the spoken part (a little before and after), so it uploads and is understood faster
      let use = chunks;
      if (firstIdx >= 0) use = chunks.slice(Math.max(0, firstIdx - 6), Math.min(chunks.length, lastIdx + 6));
      resolve({ blob: silent ? null : toWav(use, ctx.sampleRate), silent });
    };
    endListen = stop;
    proc.onaudioprocess = e => {
      const d = e.inputBuffer.getChannelData(0);
      if (Date.now() < start) return; // replay in progress
      chunks.push(new Float32Array(d));
      let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
      const rms = Math.sqrt(s / d.length);
      $('who').style.setProperty('--lvl', Math.min(1, rms * 12).toFixed(2));
      $('avatar').style.setProperty('--lvl', Math.min(1, rms * 12).toFixed(2));
      if (paused) { start = Date.now(); chunks = []; speech = false; return; } // paused: never time out
      if (typingNow()) { start = Math.max(start, nowTyping); return; } // typing: do not time out
      const nowT = Date.now();
      if (cal < 3) { noise += rms; cal++; if (cal === 3) noise = Math.min(noise / 3, 0.02); return; }
      const thr = Math.max(0.015, noise * 3);
      if (rms > thr) {
        if (!speech) { firstVoiceAt = nowT; firstIdx = chunks.length - 1; }
        speech = true; lastVoice = nowT; lastIdx = chunks.length - 1;
      }
      // short answers (yes / no / a word) end sooner; long ones wait a little more for a pause in speech
      const gap = lastVoice - firstVoiceAt < 2000 ? 1150 : 1600;
      if (speech && nowT - lastVoice > gap) stop('speech');
      else if (!speech && nowT - start > 14000) stop('silent');
      else if (nowT - start > 40000) stop('speech');
    };
    // after a replay, start fresh
    const resume = setInterval(() => { if (done) return clearInterval(resume); if (start > Date.now() + 1000 && !$('repeatBtn').disabled) { start = Date.now(); } }, 300);
  });
}

function toWav(chunks, rate){
  let len = 0; chunks.forEach(c => len += c.length);
  const all = new Float32Array(len); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
  const target = 16000, ratio = rate / target, n = Math.floor(len / ratio);
  const pcm = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * ratio), b = Math.min(len, Math.floor((i + 1) * ratio));
    let s = 0; for (let j = a; j < b; j++) s += all[j];
    const v = Math.max(-1, Math.min(1, s / Math.max(1, b - a)));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (off, str) => { for (let i = 0; i < str.length; i++) v.setUint8(off + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, target, true); v.setUint32(28, target * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: 'audio/wav' });
}

async function doVoice(t){
  const wasBarge = bargedIn; bargedIn = false;
  const r = await listen();
  if (wasBarge && (r.silent || !r.blob) && !r.text) allowBarge.off = true; // it was echo, not the customer
  setStatus('think', 's_think');
  const fd = new FormData();
  fd.append('stage', t.stage);
  if (r.text) fd.append('text', r.text);
  else if (r.silent || !r.blob) fd.append('silence', '1'); else fd.append('audio', r.blob, 'answer.wav');
  const d = await post('/turn', fd, true);
  if (d.inactive) return d;
  $('heard').textContent = d.heard ? tr('heard') + d.heard : (d.noisy ? tr('noisy') : '');
  if (d.noisy && wasBarge) allowBarge.off = true;
  if (d.noisy && ++noisyCount >= 2) openTypeNext = true; // noisy place: offer typing
  if (d.heard) noisyCount = 0;
  return d.turn;
}

// ---------- photos ----------
async function countdown(n){
  const c = $('countdown'), arc = $('ringArc'), num = $('countNum');
  c.classList.add('show');
  for (let i = n; i >= 1; i--) {
    num.textContent = i;
    arc.style.transition = 'none'; arc.style.strokeDashoffset = 364.4 * (1 - i / n);
    await sleep(30);
    arc.style.transition = 'stroke-dashoffset .97s linear'; arc.style.strokeDashoffset = 364.4 * (1 - (i - 1) / n);
    await sleep(970);
  }
  c.classList.remove('show');
}
function snap(maxW){
  const v = $('cam');
  const w = v.videoWidth || 640, h = v.videoHeight || 480, k = maxW && w > maxW ? maxW / w : 1;
  const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', maxW ? 0.7 : 0.88));
}
function flash(){ $('flash').classList.add('on'); setTimeout(() => $('flash').classList.remove('on'), 60); }

async function doPhoto(t){
  setStatus('wait', 's_photo');
  await countdown(t.countdown || 3);
  const blob = await snap(); flash();
  setStatus('think', 's_think');
  const fd = new FormData(); fd.append('stage', t.stage); addLoc(fd); fd.append('photo', blob, t.shot + '.jpg');
  const d = await post('/photo', fd, true);
  return d.inactive ? d : d.turn;
}

async function doBlink(t){
  setStatus('wait', 's_photo');
  await countdown(t.countdown || 2);
  $('gFace').classList.add('blinking');
  const frames = [];
  for (let i = 0; i < 14; i++) { frames.push(await snap(360)); await sleep(230); }
  $('gFace').classList.remove('blinking');
  setStatus('think', 's_think');
  const fd = new FormData(); fd.append('stage', t.stage); addLoc(fd);
  frames.forEach((b, i) => fd.append('frames', b, 'f' + i + '.jpg'));
  const d = await post('/burst', fd, true);
  return d.inactive ? d : d.turn;
}

// ---------- documents on WhatsApp ----------
function renderDocs(s, doc){
  const row = (label, ok) => `<div class="docrow"><span>${label}</span><span class="tag ${ok ? 'ok' : 'wait'}">${ok ? '✓ ' + tr('received') : tr('waiting')}</span></div>`;
  if (doc === 'chats') {
    const n = (s.chats || {}).count || 0;
    $('docRows').innerHTML = `<div class="docrow"><span>${tr('shotsGot')}</span><span class="tag ${n ? 'ok' : 'wait'}">${n ? '✓ ' + n : tr('waiting')}</span></div>`;
    $('chatDoneBtn').disabled = n < 1;
    return;
  }
  $('docRows').innerHTML = doc === 'aadhaar' ? row(tr('a_front'), s.aadhaar.front) + row(tr('a_back'), s.aadhaar.back) : row(tr('pan'), s.pan.received);
}
$('skipBtn').addEventListener('click', () => { docSkip = true; });

let chatDone = false;
$('chatDoneBtn').addEventListener('click', () => { chatDone = true; });

async function doDocs(t){
  setStatus('wait', 's_wait');
  docSkip = false; chatDone = false; docStartedAt = Date.now(); $('skipBtn').style.display = 'none';
  const chats = t.doc === 'chats';
  $('chatKw').style.display = chats ? 'block' : 'none';
  $('chatDoneBtn').style.display = chats ? 'block' : 'none';
  $('skipBtn').textContent = tr(chats ? 'chatSkip' : 'cantSend');
  if (chats) { $('chatKw').innerHTML = esc(tr('searchThese')) + '<br>' + (t.keywords || []).map(k => `<b>${esc(k)}</b>`).join(''); $('skipBtn').style.display = 'block'; }
  while (!handedOff) {
    let s;
    try { const r = await fetch(API + '/status'); s = await r.json(); } catch { await sleep(3000); continue; }
    renderDocs(s, t.doc);
    if (Date.now() - docStartedAt > 40000) $('skipBtn').style.display = 'block';
    if (s.unreadable > seenUnreadable) { seenUnreadable = s.unreadable; setStatus('think', 's_read'); const d = await post('/advance', { stage: t.stage, nudge: true }); return d.inactive ? d : d.turn; }
    if (chats) {
      if (chatDone && (s.chats || {}).count >= 1) { setStatus('think', 's_read'); const d = await post('/advance', { stage: t.stage, done: true }); $('chatDoneBtn').style.display = 'none'; $('chatKw').style.display = 'none'; return d.inactive ? d : d.turn; }
      if (docSkip || Date.now() - docStartedAt > 15 * 60 * 1000) { setStatus('think', 's_think'); const d = await post('/advance', { stage: t.stage, skip: true }); $('chatDoneBtn').style.display = 'none'; $('chatKw').style.display = 'none'; return d.inactive ? d : d.turn; }
      await sleep(chatDone ? 800 : 3000); continue;
    }
    if (s.ready) { setStatus('think', 's_read'); const d = await post('/advance', { stage: t.stage }); return d.inactive ? d : d.turn; }
    if (docSkip || Date.now() - docStartedAt > 8 * 60 * 1000) { setStatus('think', 's_think'); const d = await post('/advance', { stage: t.stage, skip: true }); return d.inactive ? d : d.turn; }
    await sleep(3000);
  }
  return { inactive: true };
}

$('humanBtn').addEventListener('click', () => { try { $('humanDlg').showModal(); } catch { if (confirm(tr('humanQ'))) handoff(); } });

async function handoff(){
  if (handedOff || finished) return;
  handedOff = true;
  if (endListen) endListen('silent');
  setStatus('think', 's_save');
  let d = {};
  try { d = await post('/handoff', { reason: 'Customer tapped the button' }); } catch {}
  if (d.displayText || d.message) { $('cap').textContent = d.displayText || d.message; setStatus('ai', 's_ai'); await playAudio(d.audio, d.displayText || d.message); }
  await stopAndUploadRecording();
  teardown();
  showEnd(tr('endHuman'));
}

// ---------- finish ----------
async function finish(){
  if (finished) return; finished = true;
  setStatus('think', 's_save'); showGuide(null);
  try { await post('/complete', {}); } catch (e) { /* the team can still review the recording */ }
  await stopAndUploadRecording();
  teardown();
  showEnd(tr('endOk'));
}
function stopAndUploadRecording(){
  return new Promise(resolve => {
    if (!recorder || recorder.state === 'inactive') return resolve();
    recorder.onstop = async () => {
      try {
        const blob = new Blob(recChunks, { type: recorder.mimeType || 'video/webm' });
        const fd = new FormData(); fd.append('recording', blob, 'call.webm');
        await post('/recording', fd, true);
      } catch (e) {}
      resolve();
    };
    try { recorder.stop(); } catch { resolve(); }
  });
}
function teardown(){
  try { camStream.getTracks().forEach(t => t.stop()); } catch {}
  try { ctx.close(); } catch {}
  try { if (geoWatch != null) navigator.geolocation.clearWatch(geoWatch); } catch {}
  try { wakeLock && wakeLock.release(); } catch {}
}
function showEnd(msg){
  $('call').style.display = 'none'; $('start').style.display = 'none'; $('end').style.display = 'block';
  paintText(); if (msg) $('endMsg').textContent = msg;
}
window.addEventListener('pagehide', () => { if (started && !finished && !handedOff) navigator.sendBeacon(API + '/left', new Blob(['{}'], { type: 'application/json' })); });
</script>
