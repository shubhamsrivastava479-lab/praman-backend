<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praman Verified certificate</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#04345a">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F5F3EE;color:#0B2A45;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .c{background:#fff;border-radius:20px;max-width:440px;width:100%;overflow:hidden;box-shadow:0 14px 40px rgba(11,42,69,.15)}
  .h{background:linear-gradient(135deg,#0B2A45,#163B5C);color:#fff;padding:24px;text-align:center}
  .h img{height:34px;background:#fff;border-radius:8px;padding:4px 8px}
  .seal{width:84px;height:84px;border-radius:42px;background:#E8A34F;color:#0B2A45;display:flex;align-items:center;justify-content:center;margin:18px auto 8px}
  .h b{display:block;font-size:22px;letter-spacing:.5px}
  .b{padding:22px}
  .name{font-family:Georgia,serif;font-size:28px;font-weight:600;text-align:center;margin:0 0 4px}
  .sub{text-align:center;color:#5B6773;font-size:14px;margin:0 0 16px}
  ul{list-style:none;padding:0;margin:0 0 16px}li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F0F1F3;font-size:15px}li svg{color:#1F7A6C;flex:none}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:#5B6773;gap:10px}
  .bad{background:#F6E0DB;color:#7A1F1F;border-radius:12px;padding:12px;font-size:14px;text-align:center;margin-bottom:12px}
  .f{text-align:center;font-size:12px;color:#8A939C;padding:0 20px 20px}
</style>
</head>
<body>
<div class="c" id="c"><div class="b" style="text-align:center;color:#5B6773">Loading…</div></div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d = s => new Date(s).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
const tick = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
(async () => {
  const t = new URLSearchParams(location.search).get('t') || '';
  const r = await fetch('/api/public/cert/' + encodeURIComponent(t)).catch(() => null);
  const x = r && r.ok ? await r.json() : null;
  if (!x) { document.getElementById('c').innerHTML = '<div class="b"><p class="name">Not found</p><p class="sub">This certificate link is not valid.</p></div>'; return; }
  document.getElementById('c').innerHTML = `
    <div class="h"><img src="/logo-compact.png" alt="Praman"><div class="seal"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div><b>PRAMAN VERIFIED</b></div>
    <div class="b">
      ${x.expired ? '<div class="bad">This certificate has expired. Ask the person for a new one.</div>' : ''}
      <p class="name">${esc(x.name)}</p><p class="sub">Mobile ${esc(x.mobile)} · Certificate ${esc(x.ref)}</p>
      <ul>${x.checks.map(c => `<li>${tick}<span>${esc(c)}</span></li>`).join('')}</ul>
      <div class="meta"><span>Verified on<br><b>${d(x.verifiedOn)}</b></span><span style="text-align:right">Valid until<br><b>${d(x.validUntil)}</b></span></div>
    </div>
    <div class="f">Issued by SatyaSakshi LLP through the SatyaSakshi Praman app. This certificate confirms the checks listed above on the date shown; it is not a police verification.</div>`;
})();
</script>
</body>
</html>
