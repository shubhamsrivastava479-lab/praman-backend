<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SatyaSakshi Praman — Verify before you trust</title>
<meta name="description" content="Verify a tenant, maid, driver, matrimonial match, online buyer or seller, or a used vehicle — on a WhatsApp video call with consent. By SatyaSakshi LLP.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#04345a">
<style>
  :root{--navy:#0B2A45;--navy2:#163B5C;--amber:#C8781F;--amberD:#9A520B;--amberL:#FBE9D2;--ink:#0B2A45;--mut:#5B6773;--line:#DCE3EA;--bg:#F5F3EE;--ok:#1F7A6C;--bad:#B23A2C}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:80px}
  button,input,select{font:inherit}
  .top{background:var(--navy);color:#fff;padding:18px 18px 22px;position:sticky;top:0;z-index:5}
  .top .row{display:flex;align-items:center;gap:10px}
  .top img{height:30px;background:#fff;border-radius:8px;padding:3px 7px}
  .top h1{margin:0;font-size:19px;font-weight:700;flex:1}
  .top p{margin:8px 0 0;color:#C9D6E2;font-size:14px}
  .back{background:none;border:none;color:#fff;font-size:22px;padding:0 6px 0 0;cursor:pointer}
  main{padding:16px;max-width:560px;margin:0 auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .pk{display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;color:inherit}
  .pk:active{transform:scale(.99)}
  .ic{width:52px;height:52px;border-radius:26px;background:var(--amberL);color:var(--amberD);display:flex;align-items:center;justify-content:center;flex:none}
  .ic.dark{background:var(--navy);color:#E8A34F}
  .pk b{display:block;font-size:16px}
  .pk small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
  .price{margin-left:auto;font-weight:800;color:var(--amberD);white-space:nowrap;font-size:15px}
  .soon{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
  h2{font-size:17px;margin:6px 0 12px}
  label{display:block;font-size:13px;font-weight:600;color:#44505C;margin:12px 0 6px}
  input[type=text],input[type=tel],input[type=email]{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
  .ph{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.ph span{background:#F1F3F5;padding:13px 12px;font-weight:600;color:#44505C}.ph input{border:none;border-radius:0}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;background:var(--amber);color:#fff;font-size:16px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:14px}
  .btn.navy{background:var(--navy)}.btn.green{background:#1F8A5B}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn:disabled{opacity:.6}
  .msg{font-size:14px;margin-top:10px;min-height:18px}.err{color:var(--bad)}.ok{color:var(--ok)}
  ul.ck{list-style:none;padding:0;margin:0}ul.ck li{display:flex;gap:10px;padding:7px 0;font-size:14.5px;border-bottom:1px solid #F0F1F3}ul.ck li:last-child{border:none}
  ul.ck svg{color:var(--ok);flex:none;margin-top:1px}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#44505C;margin-top:14px;font-weight:400}
  .consent input{margin-top:3px;width:18px;height:18px;flex:none}
  .bill{font-size:14px;color:#44505C}.bill div{display:flex;justify-content:space-between;padding:3px 0}.bill .t{font-weight:800;color:var(--ink);font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
  .tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
  .tabs button{flex:1;background:none;border:none;padding:10px 4px 9px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .tabs button.on{color:var(--amberD);font-weight:700}
  .st{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
  .st.wait{background:#E2E8FB;color:#2B3A8C}.st.rev{background:var(--amberL);color:var(--amberD)}.st.done{background:#DCEFEC;color:var(--ok)}.st.bad{background:#F6E0DB;color:#7A1F1F}
  .steps{display:flex;flex-direction:column;gap:0;margin-top:6px}
  .steps div{display:flex;gap:12px;align-items:flex-start;font-size:14px;padding:6px 0;color:#8A939C}
  .steps div.done{color:var(--ink)}.steps div.now{color:var(--amberD);font-weight:700}
  .dot{width:22px;height:22px;border-radius:11px;border:2px solid #C9D0D8;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff}
  .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.now .dot{border-color:var(--amber)}
  .facts div{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;border-bottom:1px solid #F0F1F3}.facts span:first-child{color:var(--mut);text-transform:capitalize}.facts span:last-child{text-align:right;font-weight:600;word-break:break-word}
  .hero{background:linear-gradient(135deg,#0B2A45,#163B5C);color:#fff;border-radius:18px;padding:18px;margin-bottom:16px}
  .hero b{font-size:18px;display:block}.hero p{margin:6px 0 0;color:#C9D6E2;font-size:14px}
  .hide{display:none!important}
  .center{text-align:center}
  a.link{color:#0A4A7C;font-weight:600}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="row"><button class="back hide" id="backBtn" onclick="go(backTo)" aria-label="Back">←</button><img src="/logo-compact.png" alt="Praman"><h1 id="title">SatyaSakshi Praman</h1></div>
  <p id="sub">Verify before you trust · भरोसे से पहले जाँच</p>
</header>
<main id="app"></main>
<nav class="tabs hide" id="tabs">
  <button id="t_home" onclick="go('home')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Verify</button>
  <button id="t_orders" onclick="go('orders')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>My checks</button>
  <button id="t_account" onclick="go('account')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Account</button>
</nav>
<script>
const API = '/api/consumer';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
let token = store.get('sp_token'), me = null, packages = [], backTo = 'home', mobileTyped = '';
const SUPPORT = '917065567277';
const ICONS = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 21v-1a5 5 0 0 0-4-4.9"/>',
  car: '<path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M5 12h14"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  shop: '<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v8h14v-8"/>',
  badge: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  call: '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/>'
};
const svg = (n, s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.badge}</svg>`;
const tick = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';

async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout(); throw new Error('Please log in again.'); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
  return d;
}
function header(title, sub, back) {
  $('title').textContent = title; $('sub').textContent = sub || ''; $('sub').classList.toggle('hide', !sub);
  $('backBtn').classList.toggle('hide', !back); backTo = back || 'home';
}
function tabs(on) { $('tabs').classList.toggle('hide', !token); ['home','orders','account'].forEach(t => $('t_' + t).classList.toggle('on', t === on)); }
function logout() { token = null; me = null; store.set('sp_token', null); go('login'); }

// ---------- screens ----------
async function go(screen, arg) {
  window.scrollTo(0, 0);
  if (!token && screen !== 'login') screen = 'login';
  try { history.replaceState(null, '', '#' + screen + (arg ? '/' + arg : '')); } catch {}
  if (screen === 'login') return loginScreen();
  if (!packages.length) { try { packages = (await api('/packages')).packages; } catch {} }
  if (screen === 'home') return homeScreen();
  if (screen === 'pkg') return pkgScreen(arg);
  if (screen === 'orders') return ordersScreen();
  if (screen === 'order') return orderScreen(arg);
  if (screen === 'account') return accountScreen();
  homeScreen();
}

function loginScreen() {
  header('SatyaSakshi Praman', 'Verify before you trust · भरोसे से पहले जाँच'); tabs();
  $('app').innerHTML = `
    <div class="hero"><b>Check a tenant, maid, driver, match, seller or vehicle</b><p>On a recorded video call with the person’s consent. Reviewed by SatyaSakshi investigators.</p></div>
    <div class="card">
      <div id="l1">
        <label for="mob">Your mobile number / आपका मोबाइल नंबर</label>
        <div class="ph"><span>+91</span><input id="mob" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="98XXXXXXXX" value="${esc(mobileTyped)}"></div>
        <button class="btn" id="b1" onclick="sendOtp()">Get code on WhatsApp</button>
      </div>
      <div id="l2" class="hide">
        <label for="code">Code received on WhatsApp</label>
        <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
        <label for="nm">Your name (first time only)</label>
        <input id="nm" type="text" autocomplete="name" placeholder="Full name">
        <button class="btn" id="b2" onclick="verifyOtp()">Continue</button>
        <button class="btn ghost" onclick="$('l2').classList.add('hide');$('l1').classList.remove('hide')">Change number</button>
      </div>
      <div class="msg" id="lm" role="alert"></div>
    </div>
    <a class="btn ghost" href="/app-join.html">${svg('call', 20)} I was asked to join a verification call</a>
    <p class="center" style="font-size:12px;color:#8A939C;margin-top:18px">By continuing you agree to the <a class="link" href="/privacy.html">privacy policy</a>. SatyaSakshi LLP</p>`;
}
async function sendOtp() {
  const n = $('mob').value.replace(/\D/g, '').slice(-10); mobileTyped = n;
  if (!/^[6-9]\d{9}$/.test(n)) { $('lm').className = 'msg err'; $('lm').textContent = 'Enter your 10-digit mobile number.'; return; }
  $('b1').disabled = true; $('lm').className = 'msg'; $('lm').textContent = 'Sending…';
  try { await api('/otp', { method: 'POST', body: JSON.stringify({ mobile: n }) }); $('l1').classList.add('hide'); $('l2').classList.remove('hide'); $('lm').className = 'msg ok'; $('lm').textContent = 'Code sent on WhatsApp.'; $('code').focus(); }
  catch (e) { $('lm').className = 'msg err'; $('lm').textContent = e.message; }
  finally { $('b1').disabled = false; }
}
async function verifyOtp() {
  const code = $('code').value.replace(/\D/g, '');
  if (code.length !== 6) { $('lm').className = 'msg err'; $('lm').textContent = 'Enter the 6-digit code.'; return; }
  $('b2').disabled = true;
  try {
    const d = await api('/login', { method: 'POST', body: JSON.stringify({ mobile: mobileTyped, code, name: $('nm').value.trim() }) });
    token = d.token; me = d.consumer; store.set('sp_token', token); go('home');
  } catch (e) { $('lm').className = 'msg err'; $('lm').textContent = e.message; }
  finally { $('b2').disabled = false; }
}

function homeScreen() {
  header('What do you want to verify?', 'Choose a check · क्या जाँचना है?'); tabs('home');
  const person = packages.filter(p => p.kind === 'person' && !p.self), other = packages.filter(p => p.kind !== 'person' || p.self);
  const row = p => `<button class="pk" onclick="go('pkg','${p.id}')"><span class="ic ${p.self ? 'dark' : ''}">${svg(p.icon)}</span><span><b>${esc(p.short)}</b><small>${esc(p.tagline)}</small></span>${p.available ? (p.price ? `<span class="price">${rs(p.price)}</span>` : '<span class="soon">Test</span>') : '<span class="soon">Coming soon</span>'}</button>`;
  $('app').innerHTML = `<h2>Check a person</h2>${person.map(row).join('')}<h2 style="margin-top:20px">More</h2>${other.map(row).join('')}
    <a class="pk" href="/app-join.html" style="text-decoration:none"><span class="ic">${svg('call')}</span><span><b>Join a verification call</b><small>Someone asked to verify you? Join here.</small></span></a>`;
}

function pkgScreen(id) {
  const p = packages.find(x => x.id === id); if (!p) return go('home');
  header(p.short, p.tagline, 'home'); tabs('home');
  const form = p.kind === 'vehicle'
    ? `<label for="veh">Vehicle number</label><input id="veh" type="text" placeholder="e.g. UP16AB1234" style="text-transform:uppercase">`
    : p.self ? `<label for="sn">Your full name (as on your ID)</label><input id="sn" type="text" autocomplete="name" value="${esc(me && me.name || '')}">`
    : `<label for="sn">Name of the person</label><input id="sn" type="text" placeholder="Full name">
       <label for="sm">Their WhatsApp number</label><div class="ph"><span>+91</span><input id="sm" type="tel" inputmode="numeric" maxlength="10" placeholder="98XXXXXXXX"></div>`;
  const consent = p.self ? 'These are my own details. I agree to a recorded video call.' : p.kind === 'vehicle' ? 'I want to check this vehicle for a genuine purchase or sale.' : 'The person knows about this check, and I have a genuine reason (tenancy, work, marriage or a deal). They will be asked for consent before the call.';
  $('app').innerHTML = `
    <div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="ic ${p.self ? 'dark' : ''}">${svg(p.icon)}</span><div><b style="font-size:17px">${esc(p.name)}</b><div style="color:var(--mut);font-size:13px">For: ${esc(p.who)}</div></div></div></div>
    <div class="card"><h2 style="margin-top:0">What we check</h2><ul class="ck">${p.checks.map(c => `<li>${tick}<span>${esc(c)}</span></li>`).join('')}</ul>
      ${p.kind === 'person' ? `<p style="font-size:13px;color:var(--mut);margin:10px 0 0">${p.self ? 'You take a 10–15 minute video call from this phone.' : 'The person gets a WhatsApp link, agrees, and takes a 10–15 minute video call from their phone.'} A SatyaSakshi verifier reviews it and the report comes here.</p>` : '<p style="font-size:13px;color:var(--mut);margin:10px 0 0">Results come in about a minute.</p>'}</div>
    <div class="card">${form}
      <label class="consent"><input type="checkbox" id="ok"> <span>${esc(consent)}</span></label>
      ${p.price ? `<div class="bill" style="margin-top:14px"><div><span>Price</span><span>${rs(p.price)}</span></div><div style="font-size:12px"><span>Includes GST</span><span></span></div></div>` : ''}
      <button class="btn" id="buy" onclick="buy('${p.id}')" ${p.available ? '' : 'disabled'}>${p.available ? (p.price ? 'Pay ' + rs(p.price) + ' and start' : 'Start (test mode)') : 'Coming soon'}</button>
      <div class="msg" id="pm" role="alert"></div></div>`;
}

async function buy(id) {
  const p = packages.find(x => x.id === id), m = $('pm');
  const body = { package: id, confirm: $('ok').checked };
  if (p.kind === 'vehicle') body.input = { vehicleNumber: $('veh').value };
  else body.subject = { name: $('sn').value.trim(), mobile: p.self ? '' : ($('sm') ? $('sm').value : '') };
  if (!body.confirm) { m.className = 'msg err'; m.textContent = 'Please tick the box to continue.'; return; }
  $('buy').disabled = true; m.className = 'msg'; m.textContent = 'Please wait…';
  try {
    const d = await api('/orders', { method: 'POST', body: JSON.stringify(body) });
    if (!d.pay) return go('order', d.order.id);
    await loadRazorpay();
    const rz = new window.Razorpay({ key: d.pay.key, amount: d.pay.amount, currency: d.pay.currency, order_id: d.pay.orderId, name: d.pay.name, description: d.pay.description, prefill: d.pay.prefill,
      theme: { color: '#0B2A45' },
      handler: async resp => {
        m.textContent = 'Confirming payment…';
        try { const r = await api('/orders/' + d.order.id + '/pay', { method: 'POST', body: JSON.stringify(resp) }); go('order', r.order.id); }
        catch (e) { m.className = 'msg err'; m.textContent = e.message; }
      },
      modal: { ondismiss: () => { $('buy').disabled = false; m.className = 'msg'; m.textContent = 'Payment not completed.'; } } });
    rz.open();
  } catch (e) { m.className = 'msg err'; m.textContent = e.message; $('buy').disabled = false; }
}
function loadRazorpay() {
  return new Promise((ok, no) => { if (window.Razorpay) return ok(); const s = document.createElement('script'); s.src = 'https://checkout.razorpay.com/v1/checkout.js'; s.onload = ok; s.onerror = () => no(new Error('Could not open the payment page. Check your internet.')); document.head.appendChild(s); });
}

const ST = { waiting_for_person: ['wait', 'Waiting for the person'], call_in_progress: ['wait', 'Video call going on'], under_review: ['rev', 'Being reviewed'], report_ready: ['done', 'Report ready'],
  completed: ['done', 'Done'], needs_team: ['rev', 'Our team is on it'], in_progress: ['wait', 'In progress'], paid: ['wait', 'Paid'] };
async function ordersScreen() {
  header('My checks', 'Your orders and reports'); tabs('orders');
  $('app').innerHTML = '<p class="center" style="color:var(--mut)">Loading…</p>';
  try {
    const { orders } = await api('/orders');
    $('app').innerHTML = orders.length ? orders.map(o => { const s = ST[o.status] || ['wait', o.status];
      return `<button class="pk" onclick="go('order','${o.id}')"><span class="ic">${svg((packages.find(p => p.id === o.package) || {}).icon)}</span><span><b>${esc(o.packageName)}</b><small>${esc(o.subject ? o.subject.name : (o.input && o.input.vehicleNumber) || '')} · ${esc(o.ref)}</small><small><span class="st ${s[0]}">${esc(s[1])}</span></small></span></button>`; }).join('')
      : `<div class="card center"><p>No checks yet.</p><button class="btn" onclick="go('home')">Start a check</button></div>`;
  } catch (e) { $('app').innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

async function orderScreen(id) {
  header('Check details', '', 'orders'); tabs('orders');
  $('app').innerHTML = '<p class="center" style="color:var(--mut)">Loading…</p>';
  let o; try { o = (await api('/orders/' + id)).order; } catch (e) { $('app').innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  header(o.packageName, o.ref, 'orders');
  const s = ST[o.status] || ['wait', o.status];
  let body = '';
  if (o.kind === 'vehicle') {
    body = (o.checks || []).map(c => `<div class="card"><b>${esc(c.label)}</b> <span class="st ${c.status === 'done' ? 'done' : 'bad'}">${c.status === 'done' ? 'Done' : 'Not available'}</span>
      ${c.facts && c.facts.length ? `<div class="facts" style="margin-top:8px">${c.facts.map(f => `<div><span>${esc(f[0])}</span><span>${esc(f[1])}</span></div>`).join('')}</div>` : `<p style="font-size:13px;color:var(--mut)">${esc(c.reason || 'Our team will add this result.')}</p>`}</div>`).join('');
  } else {
    const order = ['waiting_for_person', 'call_in_progress', 'under_review', 'report_ready'], at = order.indexOf(o.status);
    const labels = o.self ? ['Paid', 'Take your video call', 'Being reviewed', 'Certificate ready'] : ['Paid · link sent to ' + (o.subject ? o.subject.name : 'the person'), 'Person takes the video call', 'SatyaSakshi verifier reviews', 'Report ready'];
    body = `<div class="card"><div class="steps">${labels.map((l, i) => `<div class="${i < at || (i === order.length - 1 && at === order.length - 1) || i === 0 ? 'done' : i === at ? 'now' : ''}"><span class="dot">${i < at || i === 0 || (at === order.length - 1) ? '✓' : ''}</span>${esc(l)}</div>`).join('')}</div></div>`;
    if (o.subjectLink && o.status === 'waiting_for_person') {
      if (o.self) body += `<a class="btn green" href="${esc(o.subjectLink)}">${svg('call', 20)} Start my video call</a>`;
      else {
        const text = `Namaste ${o.subject ? o.subject.name : ''}, please take a short video verification call for ${o.packageName} (SatyaSakshi Praman). Link: ${o.subjectLink}`;
        body += `<div class="card"><p style="margin:0 0 6px;font-size:14px">${esc(o.linkError || 'Send the call link to the person.')}</p><a class="btn green" href="https://wa.me/?text=${encodeURIComponent(text)}">Send link on WhatsApp</a></div>`;
      }
    }
    if (o.reportUrl) body += `<a class="btn navy" href="${esc(o.reportUrl)}">Open the report</a>`;
    if (o.certUrl) body += `<a class="btn" href="${esc(o.certUrl)}">View my Praman Verified certificate</a>
      <a class="btn green" href="https://wa.me/?text=${encodeURIComponent('My Praman Verified certificate: ' + o.certUrl)}">Share certificate on WhatsApp</a>`;
    if (o.self && o.status === 'report_ready' && !o.certUrl) body += `<div class="card" style="font-size:14px">The verifier could not issue a certificate this time. Open the report to see why, or contact support.</div>`;
  }
  $('app').innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>${esc(o.subject ? o.subject.name : (o.input && o.input.vehicleNumber) || '')}</b><div style="font-size:12.5px;color:var(--mut)">${esc(new Date(o.createdAt).toLocaleString('en-IN'))}</div></div><span class="st ${s[0]}">${esc(s[1])}</span></div>
    ${o.price ? `<div class="bill" style="margin-top:10px"><div><span>Paid</span><span>${rs(o.price)}</span></div><div style="font-size:12px"><span>incl. GST ${o.gstPercent}%</span><span>${rs(o.gst)}</span></div></div>` : ''}</div>${body}
    <a class="btn ghost" href="https://wa.me/${SUPPORT}?text=${encodeURIComponent('Help with order ' + o.ref)}">Need help? WhatsApp us</a>`;
}

async function accountScreen() {
  header('Account', ''); tabs('account');
  try { me = (await api('/me')).consumer; } catch {}
  $('app').innerHTML = `<div class="card"><label for="an">Name</label><input id="an" type="text" value="${esc(me && me.name || '')}">
    <label for="ae">Email (for receipts)</label><input id="ae" type="email" value="${esc(me && me.email || '')}">
    <p style="font-size:13px;color:var(--mut)">Mobile: +91 ${esc(me && me.mobile || '')}</p>
    <button class="btn navy" onclick="saveMe()">Save</button><div class="msg" id="am"></div></div>
    <a class="btn ghost" href="https://wa.me/${SUPPORT}">WhatsApp support · +91 70655 67277</a>
    <a class="btn ghost" href="/privacy.html">Privacy policy</a>
    <button class="btn ghost" onclick="logout()">Log out</button>
    <p class="center" style="font-size:12px;color:#8A939C;margin-top:16px">SatyaSakshi Praman · by SatyaSakshi LLP</p>`;
}
async function saveMe() {
  try { await api('/me', { method: 'PUT', body: JSON.stringify({ name: $('an').value, email: $('ae').value }) }); $('am').className = 'msg ok'; $('am').textContent = 'Saved.'; }
  catch (e) { $('am').className = 'msg err'; $('am').textContent = e.message; }
}

const [s0, a0] = (location.hash.slice(1) || 'home').split('/');
go(token ? s0 : 'login', a0);
</script>
</body>
</html>
