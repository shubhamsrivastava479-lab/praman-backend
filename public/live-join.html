<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Praman Video Call</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#04345a">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#22307A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{--ink:#22307A;--mist:#EEF1F8;--line:#D9DEEC;--text:#1A1F36;--muted:#5B6280;--leaf:#18865A;--alert:#B4372B;--turmeric:#E09A12;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--mist);color:var(--text);font-family:'Mukta',system-ui,sans-serif;font-size:17px;line-height:1.5;}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--turmeric);outline-offset:2px;}
  #start{max-width:520px;margin:0 auto;padding:22px 16px 40px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .seal{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;}
  .brand b{font-size:21px;color:var(--ink);display:block;line-height:1.1;} .brand small{color:var(--muted);font-size:14px;}
  .note{background:var(--ink);color:#fff;border-radius:16px;padding:16px 18px;}
  .note h1{font-size:20px;margin:0 0 4px;} .note p{margin:0;font-size:15px;opacity:.9;}
  ul.k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px 12px 34px;margin:16px 0;font-size:15.5px;}
  ul.k li{margin:4px 0;}
  .consent{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;cursor:pointer;}
  .consent input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--ink);}
  .btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:18px;font-weight:700;cursor:pointer;min-height:56px;margin-top:16px;background:var(--ink);color:#fff;}
  .btn:disabled{background:#A9AFC8;}
  .err{color:var(--alert);font-size:15px;min-height:20px;margin:8px 0 0;}
  .langbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;}
  .langbox h2{font-size:16px;margin:0 0 8px;color:var(--ink);}
  .langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .lang{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font-size:16px;font-weight:600;color:var(--text);cursor:pointer;min-height:48px;font-family:inherit;}
  .lang[aria-pressed="true"]{border-color:var(--ink);background:#E6E9F7;color:var(--ink);}
  .busy{opacity:.55;pointer-events:none;}

  #call{display:none;position:fixed;inset:0;background:#05070F;color:#fff;}
  #remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05070F;}
  #local{position:absolute;right:12px;top:calc(60px + env(safe-area-inset-top));width:30vw;max-width:150px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.8);background:#222;z-index:3;}
  #local.mirror{transform:scaleX(-1);}
  .top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 30px;background:linear-gradient(to bottom,rgba(5,7,15,.75),transparent);z-index:2;display:flex;justify-content:space-between;align-items:center;font-size:14px;}
  .pill{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;display:inline-flex;gap:7px;align-items:center;}
  .pill i{width:9px;height:9px;border-radius:50%;background:#FF4D4D;animation:b 1.4s infinite;} @keyframes b{50%{opacity:.25}}
  .wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:1;}
  .wait .spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;margin-bottom:14px;} @keyframes s{to{transform:rotate(360deg)}}
  .bar{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;background:linear-gradient(to top,rgba(5,7,15,.85),transparent);z-index:3;}
  .cb{width:64px;height:64px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;}
  .cb svg{width:26px;height:26px;} .cb.off{background:#fff;color:#111;} .cb.end{background:var(--alert);}
  .ask{position:absolute;left:12px;right:12px;bottom:calc(100px + env(safe-area-inset-bottom));background:#fff;color:var(--text);border-radius:16px;padding:14px;z-index:4;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4);}
  .ask p{margin:0 0 10px;font-size:16px;} .ask .row{display:flex;gap:8px;} .ask button{flex:1;border:none;border-radius:10px;padding:12px;font-size:16px;font-weight:600;}
  .ask .y{background:var(--ink);color:#fff;} .ask .n{background:var(--mist);color:var(--ink);}
  .net{position:absolute;top:calc(56px + env(safe-area-inset-top));left:12px;background:var(--alert);font-size:13px;border-radius:8px;padding:4px 10px;z-index:4;display:none;}
  #end{display:none;max-width:520px;margin:0 auto;padding:60px 20px;text-align:center;}
  #end h1{color:var(--ink);}
</style>
<script src="/open-in-browser.js"></script>
</head>
<body>
<main id="start">
  <div class="brand"><img src="/logo-mark.png" alt="Praman" style="height:40px;width:auto;flex:none;"><div><b>Praman</b><small id="firm"></small></div></div>
  <section class="langbox">
    <h2 data-t="chooseLang">अपनी भाषा चुनें / Choose your language</h2>
    <div class="langs" id="langs" role="group"></div>
  </section>
  <div id="texty">
    <section class="note">
      <h1 data-t="title">जाँच अधिकारी के साथ वीडियो कॉल</h1>
      <p id="intro" data-t="loading">लोड हो रहा है…</p>
    </section>
    <ul class="k">
      <li data-h="b1"></li>
      <li data-h="b2"></li>
      <li data-h="b3"></li>
    </ul>
    <label class="consent"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
    <div data-browser-help></div>
    <p class="err" id="err"></p>
    <button class="btn" id="joinBtn" disabled data-t="join">वीडियो कॉल से जुड़ें</button>
  </div>
</main>

<div id="call">
  <video id="remote" autoplay playsinline></video>
  <div class="wait" id="wait"><div class="spin"></div><div id="waitText"></div></div>
  <video id="local" class="mirror" autoplay playsinline muted></video>
  <div class="top"><span class="pill"><i></i><span data-t="recording">रिकॉर्डिंग</span> <span id="timer">0:00</span></span><span class="pill" id="netq">●</span></div>
  <div class="net" id="net" data-t="netWeak"></div>
  <div class="ask" id="ask"><p id="askText"></p><div class="row"><button class="n" id="askNo" data-t="notNow"></button><button class="y" id="askYes" data-t="yesOn"></button></div></div>
  <div class="bar">
    <button class="cb" id="micBtn" aria-label="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-t="mic"></span></button>
    <button class="cb" id="flipBtn" aria-label="Switch camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 13.5a2.5 2.5 0 0 0 4.6 1.4M14.5 12.5a2.5 2.5 0 0 0-4.6-1.4"/></svg><span data-t="flip"></span></button>
    <button class="cb" id="shareBtn" aria-label="Share screen" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M12 13V8M9.5 10.5 12 8l2.5 2.5"/></svg><span data-t="screen"></span></button>
    <button class="cb end" id="endBtn" aria-label="End call"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-3.3 0-6.4.9-9 2.6.6 1.4 1.4 2.6 2.4 3.6l2.3-1.4V11c1.4-.4 2.8-.6 4.3-.6s2.9.2 4.3.6v2.8l2.3 1.4c1-1 1.8-2.2 2.4-3.6C18.4 9.9 15.3 9 12 9z"/></svg><span data-t="end"></span></button>
  </div>
</div>

<main id="end"><h1 data-t="thanks"></h1><p id="endMsg" data-t="ended"></p></main>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const API = '/api/live/join/' + encodeURIComponent(token);
const $ = id => document.getElementById(id);
let socket, pc, ice, localStream, camTrack, screenTrack = null, facing = 'user', micOn = true;
let lastLoc = null, geoWatch = null, wakeLock = null, t0 = 0, ended = false, pendingCandidates = [];
let info = null, language = 'Hindi', T = {}, officerHere = false, watchdog = null, tries = 0, waitKey = 'connecting';
const saved = (() => { try { return localStorage.getItem('praman_lang'); } catch { return null; } })();

const fill = (str, vars) => String(str || '').replace(/\{(\w+)\}/g, (m, k) => vars && vars[k] != null ? vars[k] : m);
function paint() {
  document.querySelectorAll('[data-t]').forEach(el => { if (T[el.dataset.t]) el.textContent = T[el.dataset.t]; });
  document.querySelectorAll('[data-h]').forEach(el => { if (T[el.dataset.h]) el.innerHTML = T[el.dataset.h]; });
  document.documentElement.lang = language === 'English' ? 'en' : 'hi';
  if (info) {
    $('intro').textContent = fill(T.intro, { caseRef: info.caseRef });
    $('firm').textContent = info.firm ? fill(T.from, { firm: info.firm }) : '';
  }
  if ($('call').style.display === 'block') showWait(waitKey);
}
function renderLangs() {
  const list = (info && info.languages) || [{ value: 'Hindi', label: 'हिंदी' }, { value: 'English', label: 'English' }];
  $('langs').innerHTML = list.map(l => `<button type="button" class="lang" aria-pressed="${l.value === language}" data-v="${l.value}">${l.label}</button>`).join('');
}
async function setLanguage(lang) {
  language = lang; renderLangs();
  try { localStorage.setItem('praman_lang', lang); } catch {}
  $('texty').classList.add('busy');
  try { const d = await (await fetch(API + '/texts?lang=' + encodeURIComponent(lang))).json(); if (d.texts) T = d.texts; } catch {}
  $('texty').classList.remove('busy');
  paint();
}
$('langs').addEventListener('click', e => { const b = e.target.closest('.lang'); if (b) setLanguage(b.dataset.v); });

$('consent').addEventListener('change', () => { $('joinBtn').disabled = !$('consent').checked; });
$('joinBtn').addEventListener('click', join);

(async () => {
  try {
    const r = await fetch(API + '/info'); const d = await r.json();
    if (d.error) {
      await setLanguage(saved || 'Hindi');
      $('intro').textContent = T.badLink || 'This link is not valid.'; $('joinBtn').style.display = 'none'; return;
    }
    info = d;
    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia && !/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)) $('shareBtn').style.display = '';
    await setLanguage(d.language || saved || 'Hindi');
  } catch { $('intro').textContent = 'सर्वर से जुड़ नहीं पा रहे — 30 सेकंड बाद पेज रीफ़्रेश करें। / Cannot reach the server — refresh after 30 seconds.'; }
})();

async function join() {
  $('err').textContent = ''; $('joinBtn').disabled = true;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: { echoCancellation: true, noiseSuppression: true } });
  } catch { $('err').textContent = T.allowCam; $('joinBtn').disabled = false; try { PramanBrowserHelp.show(document.querySelector('[data-browser-help]'), 'blocked'); } catch {} return; }
  camTrack = localStream.getVideoTracks()[0];
  $('local').srcObject = localStream;
  lastLoc = await new Promise(res => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => res({ latitude: p.coords.latitude, longitude: p.coords.longitude, accuracy: p.coords.accuracy }), () => res(null), { enableHighAccuracy: true, timeout: 9000 }) : res(null));
  try { geoWatch = navigator.geolocation.watchPosition(p => { lastLoc = { latitude: p.coords.latitude, longitude: p.coords.longitude, accuracy: p.coords.accuracy }; sendState(); }, () => {}, { enableHighAccuracy: true, maximumAge: 15000 }); } catch {}
  const deviceInfo = { platform: navigator.userAgentData?.platform || navigator.platform, screen: screen.width + 'x' + screen.height, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone };
  try {
    const r = await fetch(API + '/joined', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ consent: true, location: lastLoc, deviceInfo, language }) });
    if (!r.ok) throw new Error();
    ice = await (await fetch(API + '/ice')).json();
  } catch { $('err').textContent = T.startFail; $('joinBtn').disabled = false; return; }
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  $('start').style.display = 'none'; $('call').style.display = 'block';
  showWait('connecting');
  t0 = Date.now(); setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 1000);
  connectSocket();
}

function connectSocket() {
  socket = io({ transports: ['websocket', 'polling'] });
  socket.on('connect', () => {
    $('net').style.display = 'none';
    socket.emit('live-join', { token }, res => {
      if (!res || res.error) { $('waitText').textContent = (res && res.error) || 'Error'; return; }
      officerHere = (res.peers || []).includes('executive');
      if (officerHere) startOffer(); else showWait('waitOfficer');
      sendState();
    });
  });
  socket.on('live-peer', ({ role, event }) => {
    if (role !== 'executive') return;
    if (event === 'joined') { officerHere = true; showWait('connecting'); startOffer(); sendState(); }
    else { officerHere = false; clearTimeout(watchdog); showWait('officerLeft'); }
  });
  socket.on('live-signal', async ({ data, from }) => {
    if (from !== 'executive' || !pc) return;
    try {
      if (data.sdp) {
        if (pc.signalingState !== 'have-local-offer') return;
        await pc.setRemoteDescription(data.sdp);
        for (const c of pendingCandidates.splice(0)) { try { await pc.addIceCandidate(c); } catch {} }
      } else if (data.candidate) {
        if (pc.remoteDescription) { try { await pc.addIceCandidate(data.candidate); } catch {} } else pendingCandidates.push(data.candidate);
      }
    } catch (e) { console.warn('signal', e); }
  });
  socket.on('live-cmd', cmd => {
    if (cmd.type === 'reoffer') { officerHere = true; startOffer(); sendState(); }
    if (cmd.type === 'ask-back-camera' && facing === 'user') askUser(T.askBack, () => flip());
    if (cmd.type === 'ask-front-camera' && facing !== 'user') askUser(T.askFront, () => flip());
  });
  socket.on('live-replaced', () => { ended = true; cleanup(); showEnd(T.replaced); });
  socket.on('disconnect', () => { if (!ended) $('net').style.display = 'block'; });
}

async function startOffer() {
  if (ended) return;
  if (pc) { try { pc.close(); } catch {} }
  pendingCandidates = [];
  pc = new RTCPeerConnection({ iceServers: (ice && ice.iceServers) || [] });
  const vTrack = screenTrack || camTrack;
  pc.addTrack(vTrack, localStream);
  localStream.getAudioTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { $('remote').srcObject = e.streams[0]; };
  pc.onicecandidate = e => { if (e.candidate) socket.emit('live-signal', { candidate: e.candidate }); };
  const mine = pc;
  pc.onconnectionstatechange = () => {
    if (pc !== mine) return;
    const s = pc.connectionState;
    $('netq').textContent = s === 'connected' ? '● ' + (T.connected || 'Connected') : s === 'connecting' || s === 'new' ? '● ' + (T.connectingShort || '…') : '● ' + s;
    if (s === 'connected') { tries = 0; clearTimeout(watchdog); $('wait').style.display = 'none'; $('net').style.display = 'none'; }
    if (s === 'disconnected') $('net').style.display = 'block';
    if (s === 'failed') retry();
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('live-signal', { sdp: pc.localDescription });
  // If nothing connects in 20 s, start over (new offer, fresh network paths).
  clearTimeout(watchdog);
  watchdog = setTimeout(() => { if (pc === mine && pc.connectionState !== 'connected' && officerHere) retry(); }, 20000);
}
function retry() {
  if (ended || !officerHere) return;
  tries++;
  showWait('retrying');
  setTimeout(() => { if (!ended && officerHere) startOffer(); }, Math.min(1500 * tries, 6000));
}

function sendState() { if (socket && socket.connected) socket.emit('live-state', { location: lastLoc, facing, sharing: !!screenTrack, language, at: new Date().toISOString() }); }

async function replaceVideo(track) {
  const sender = pc && pc.getSenders().find(s => s.track && s.track.kind === 'video');
  if (sender) await sender.replaceTrack(track);
}

async function flip() {
  const want = facing === 'user' ? 'environment' : 'user';
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: want }, width: { ideal: 1280 }, height: { ideal: 720 } } })
      .catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: want } }));
    const nt = s.getVideoTracks()[0];
    if (!screenTrack) await replaceVideo(nt);
    localStream.removeTrack(camTrack); camTrack.stop();
    camTrack = nt; localStream.addTrack(nt);
    facing = want;
    $('local').classList.toggle('mirror', facing === 'user');
    $('local').srcObject = new MediaStream([camTrack]);
    sendState();
  } catch { alert(T.flipFail); }
}
$('flipBtn').addEventListener('click', flip);

$('micBtn').addEventListener('click', () => {
  micOn = !micOn; localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  $('micBtn').classList.toggle('off', !micOn);
});

$('shareBtn').addEventListener('click', async () => {
  if (screenTrack) { stopShare(); return; }
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ video: true });
    screenTrack = s.getVideoTracks()[0];
    screenTrack.onended = stopShare;
    await replaceVideo(screenTrack);
    $('shareBtn').classList.add('off'); sendState();
  } catch {}
});
async function stopShare() {
  if (!screenTrack) return;
  screenTrack.stop(); screenTrack = null;
  await replaceVideo(camTrack); $('shareBtn').classList.remove('off'); sendState();
}

function askUser(text, onYes) {
  $('askText').textContent = text; $('ask').style.display = 'block';
  $('askYes').onclick = () => { $('ask').style.display = 'none'; onYes(); };
  $('askNo').onclick = () => { $('ask').style.display = 'none'; };
}
function showWait(key) {
  waitKey = key;
  if (pc && pc.connectionState === 'connected' && key !== 'officerLeft') return;
  $('waitText').innerHTML = T[key] || '';
  $('wait').style.display = 'flex';
}

$('endBtn').addEventListener('click', () => {
  if (!confirm(T.endConfirm || 'End the call?')) return;
  ended = true; try { socket.emit('live-leave'); } catch {}
  cleanup(); showEnd();
});
function cleanup() {
  clearTimeout(watchdog);
  try { pc && pc.close(); } catch {}
  try { localStream.getTracks().forEach(t => t.stop()); screenTrack && screenTrack.stop(); } catch {}
  try { geoWatch != null && navigator.geolocation.clearWatch(geoWatch); } catch {}
  try { wakeLock && wakeLock.release(); } catch {}
  setTimeout(() => { try { socket.disconnect(); } catch {} }, 300);
}
function showEnd(msg) { $('call').style.display = 'none'; $('end').style.display = 'block'; if (msg) $('endMsg').textContent = msg; }
</script>
</body>
</html>
